name: ci
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Validate docker-compose
        run: |
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker-compose-cluster.yaml config --quiet
          docker compose -f docker-compose-cluster-server.yaml config --quiet
          ROBOT_ID=bot1 SERVER_HOST=127.0.0.1 docker compose -f docker-compose-cluster-robot.yaml config --quiet
      - name: Shell syntax check
        run: bash -n cluster/scripts/*.sh
      - name: Python syntax check
        run: python -m py_compile pub.py sub.py zenoh-subscriber/subscriber.py

  deploy:
    # Only deploy docs from master, and only after validation passes.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force
