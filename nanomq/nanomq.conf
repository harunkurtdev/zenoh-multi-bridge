# =============================================================================
# NanoMQ — Persistent MQTT broker for the robotics stack
# Target version: NanoMQ >= 0.21 (HOCON config format)
# Docs: https://nanomq.io/docs/en/latest/config-description/
#
# Purpose in this system:
#   - Single MQTT broker robots connect to (commands + telemetry + sensors)
#   - DURABLE persistence: every retained/queued message is stored on disk
#     (SQLite) under /data, so a crash/shutdown does NOT lose broker state.
#   - Bridges robot/sensor topics into the Zenoh mesh via zenoh-mqtt-bridge.
#
# Note: the message *recorder* service (see recorder/recorder.py) is what gives
# you a full replayable history ("see all details later"). NanoMQ persistence
# here keeps sessions/retained/inflight durable across restarts.
# =============================================================================

# --- Listeners ---------------------------------------------------------------
listeners.tcp {
  bind = "0.0.0.0:1883"
}

listeners.ws {
  bind = "0.0.0.0:8083/mqtt"
}

# --- HTTP REST / metrics API -------------------------------------------------
http_server {
  port = 8081
  limit_conn = 32
  username = "admin"
  password = "public"
  auth_type = basic
}

# --- MQTT engine tuning ------------------------------------------------------
mqtt {
  property_size = 32
  max_packet_size = 260KB
  max_mqueue_len = 4096
  retry_interval = 10s
  keepalive_multiplier = 1.25
}

# --- Persistence: durable message store (survives restart / crash) -----------
# SQLite-backed queue for retained messages and QoS 1/2 inflight/offline
# messages. mounted_file_path MUST point at a persistent Docker volume.
sqlite {
  disk_cache_size = 0            # 0 = unlimited on-disk cache
  mounted_file_path = "/data/"   # persistent volume (see docker-compose)
  flush_mem_threshold = 100      # flush to disk every N messages
  resend_interval = 5000         # ms, re-deliver offline messages
}

# --- Logging (also persisted to the volume for post-mortem) ------------------
log {
  to = [file, console]
  level = info
  dir = "/data/log"
  file = "nanomq.log"
  rotation {
    size = 50MB
    count = 10
  }
}

# --- MQTT bridge: forward robot/sensor traffic into the Zenoh mesh -----------
# Mirrors the old mosquitto.conf bridge, but from the persistent NanoMQ broker.
# zenoh-mqtt-bridge exposes an MQTT endpoint on :1884 that maps into Zenoh.
bridges.mqtt {
  nodes = [
    {
      name = zenoh
      enable = true
      connector {
        server = "mqtt-tcp://zenoh-mqtt-bridge:1884"
        proto_ver = 4
        clean_start = true
        keepalive = 60s
      }
      # local -> remote (publish robot/sensor data into Zenoh)
      forwards = [
        { remote_topic = "", local_topic = "robots/#" }
        { remote_topic = "", local_topic = "sensor/#" }
      ]
      # remote -> local (receive commands coming back from the mesh)
      subscription = [
        { remote_topic = "robots/#", local_topic = "", qos = 1 }
      ]
      parallel = 2
    }
  ]
}
