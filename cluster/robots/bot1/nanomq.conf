# =============================================================================
# NanoMQ — ROBOT bot1 local broker
#   Robot software (and cluster/scripts/sim-robot.sh) connects here.
#   Bridge -> local Zenoh router (zenoh-bot1:1883, MQTT plugin):
#     forwards     robots/bot1/telemetry/#  (stored robot + server)
#                  robots/bot1/sensor/#     (stored robot only)
#     subscription robots/bot1/cmd/#        (commands from the server cluster)
#   A topic is never both forwarded and subscribed on the same bridge -> no loops.
# Target: NanoMQ 0.25.x (-full image, SQLite enabled)
# =============================================================================

listeners.tcp {
  bind = "0.0.0.0:1883"
}

listeners.ws {
  bind = "0.0.0.0:8083/mqtt"
}

http_server {
  port = 8081
  limit_conn = 32
  username = "admin"
  password = "public"
  auth_type = basic
}

mqtt {
  property_size = 32
  max_packet_size = 260KB
  max_mqueue_len = 4096
  retry_interval = 10s
  keepalive_multiplier = 1.25
}

# Durable retained / QoS1-2 offline messages (survives robot reboot)
sqlite {
  disk_cache_size = 0
  mounted_file_path = "/data/"
  flush_mem_threshold = 100
  resend_interval = 5000
}

log {
  to = [file, console]
  level = warn
  dir = "/data/log"
  file = "nanomq.log"
  rotation {
    size = 20MB
    count = 5
  }
}

bridges.mqtt.zenoh {
  server = "mqtt-tcp://zenoh-bot1:1883"
  proto_ver = 4
  clientid = "nanomq-bot1-bridge"
  keepalive = 60s
  clean_start = true
  # local -> zenoh (empty remote_topic = keep the original topic)
  forwards = [
    { remote_topic = "", local_topic = "robots/bot1/telemetry/#", qos = 1 }
    { remote_topic = "", local_topic = "robots/bot1/sensor/#", qos = 0 }
  ]
  # zenoh -> local
  subscription = [
    { remote_topic = "robots/bot1/cmd/#", local_topic = "", qos = 1 }
  ]
  max_parallel_processes = 2
  max_send_queue_len = 4096
  max_recv_queue_len = 4096
}

# Buffer QoS>0 bridge traffic on disk while the local Zenoh router is down
bridges.mqtt.cache {
  disk_cache_size = 102400
  mounted_file_path = "/data/"
  flush_mem_threshold = 100
  resend_interval = 5000
}
