# =============================================================================
# NanoMQ — SERVER cluster node "a"
#   Server-side apps (dashboards, fleet services, nanomq_cli) connect to ANY
#   server node. All nodes bridge into the same Zenoh router (zenoh-server:1883),
#   so robot data reaches every node and commands from every node reach robots.
#     subscription robots/+/telemetry/#   (robot -> server, also stored on server)
#     forwards     robots/+/cmd/#         (server -> robot)
#                  fleet/#                (server-only storage)
#   A topic is never both forwarded and subscribed on the same bridge -> no loops.
# Target: NanoMQ 0.25.x (-full image, SQLite enabled)
# =============================================================================

listeners.tcp {
  bind = "0.0.0.0:1883"
}

listeners.ws {
  bind = "0.0.0.0:8083/mqtt"
}

http_server {
  port = 8081
  limit_conn = 32
  username = "admin"
  password = "public"
  auth_type = basic
}

mqtt {
  property_size = 32
  max_packet_size = 260KB
  max_mqueue_len = 4096
  retry_interval = 10s
  keepalive_multiplier = 1.25
}

sqlite {
  disk_cache_size = 0
  mounted_file_path = "/data/"
  flush_mem_threshold = 100
  resend_interval = 5000
}

log {
  to = [file, console]
  level = warn
  dir = "/data/log"
  file = "nanomq.log"
  rotation {
    size = 50MB
    count = 10
  }
}

bridges.mqtt.zenoh {
  server = "mqtt-tcp://zenoh-server:1883"
  proto_ver = 4
  clientid = "nanomq-server-a-bridge"
  keepalive = 60s
  clean_start = true
  forwards = [
    { remote_topic = "", local_topic = "robots/+/cmd/#", qos = 1 }
    { remote_topic = "", local_topic = "fleet/#", qos = 1 }
  ]
  subscription = [
    { remote_topic = "robots/+/telemetry/#", local_topic = "", qos = 1 }
  ]
  max_parallel_processes = 4
  max_send_queue_len = 8192
  max_recv_queue_len = 8192
}

bridges.mqtt.cache {
  disk_cache_size = 102400
  mounted_file_path = "/data/"
  flush_mem_threshold = 100
  resend_interval = 5000
}
